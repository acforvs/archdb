[project]
name = "archdb"
version = "0.1.0"
description = "Sourced database of LLM architectures and pretraining recipes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11,<13",
    "pyyaml>=6",
]

[project.scripts]
archdb = "archdb.cli:main"

[project.urls]
Homepage = "https://archdb.vladsavinov.com"
Repository = "https://github.com/acforvs/archdb"
Issues = "https://github.com/acforvs/archdb/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/archdb",
    "/exports/archdb.json",
    "/README.md",
    "/LICENSE",
    "/LICENSE-DATA",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel.force-include]
"exports/archdb.json" = "archdb/_data/archdb.json"

[tool.ruff]
line-length = 110
