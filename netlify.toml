[build]
  command = "python -m pip install . && python -m archdb.cli build && npm --prefix web ci && npm --prefix web run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "24"
  PYTHON_VERSION = "3.13"

[functions]
  directory = "web/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/data/dataset.json"
  to = "/data.json"
  status = 301

[[redirects]]
  from = "/data/DATA_LICENSE"
  to = "/LICENSE-DATA"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
