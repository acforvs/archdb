name: MiniMax-M3.1-Flash
org: MiniMax
kind: reasoning
note: "No base checkpoint is public; facts describe the released post-trained checkpoint. The card says M3.1-Flash builds on MiniMax-M3 and keeps its MoE architecture, with three changes: MSA in all layers, quantization-aware training of the routed experts and attention paths, and a DSpark draft head replacing MTP for speculative decoding. Whether the backbone was trained from scratch or continued from M3 is not stated."

sources:
  card: {url: https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash/resolve/2f33a8b9ae49ce7b51c994df97166a7fd059bc2e/README.md, kind: model-card}
  config: {url: https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash/resolve/2f33a8b9ae49ce7b51c994df97166a7fd059bc2e/config.json, kind: config}
  index: {url: https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash/resolve/2f33a8b9ae49ce7b51c994df97166a7fd059bc2e/model.safetensors.index.json, kind: config}
  chat-template: {url: https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash/resolve/2f33a8b9ae49ce7b51c994df97166a7fd059bc2e/chat_template.jinja, kind: code}
  hf-commits: {url: https://huggingface.co/api/models/MiniMaxAI/MiniMax-M3.1-Flash/commits/2f33a8b9ae49ce7b51c994df97166a7fd059bc2e, kind: api}
  hf-transformers: {url: https://raw.githubusercontent.com/huggingface/transformers/d4804f9d76b8c071b993d813e9e87067b780cbee/src/transformers/models/minimax_m3_vl/modeling_minimax_m3_vl.py, kind: code}

not_disclosed:
  - mtp.depth
  - ctx.pretrain
  - ctx.final
  - train.tokens
  - train.optimizer
  - train.lr_peak
  - train.lr_min
  - train.schedule
  - train.warmup
  - train.batch
  - train.weight_decay
  - train.betas
  - train.grad_clip
  - train.precision
  - params.active_non_embedding

facts:
  meta.released:
    value: "2026-10-23"
    source: hf-commits
    at: "Hugging Face commit history; 'Init MiniMaxAI/MiniMax-M3.1-Flash' 54e4e69"
    quote: "\"date\":\"2026-10-23T03:37:20.000Z\""
    note: "Date of the first commit with weights. The launch blog (2026-10-19, https://web.archive.org/web/20261019132650/https://www.minimax.io/blog/minimax-m31f) made the model available through the API only and says \"Model weights will be released later.\" The repository was created 2026-10-17, before any commit; when it became public is not recorded."
  meta.license:
    value: "other (minimax-community)"
    source: card
    at: "README.md; YAML front matter"
    quote: "license_name: minimax-community"
    note: "LICENSE (MINIMAX COMMUNITY LICENSE) grants use for non-commercial purposes; commercial use requires a \"Built with MiniMax M3.1-Flash\" notice and a one-time notice to MiniMax, or prior written authorization above US$20M yearly revenue."
  meta.modality:
    value: "text + image + video"
    source: card
    at: "README.md; Model at a Glance"
    quote: "Text, image, and video inputs; text output"

  params.active:
    value: 23_000_000_000
    source: card
    at: "README.md; Model at a Glance"
    quote: "Approximately 428B total; 23B activated per token"
  params.note:
    value: "Approximate publisher figures for a native multimodal model; whether the vision encoder or the DSpark draft head is included is not stated. Same figures as MiniMax-M3."
    source: card
    at: "README.md; Model at a Glance"
    quote: "Approximately 428B total; 23B activated per token"
  params.total:
    value: 428_000_000_000
    source: card
    at: "README.md; Model at a Glance"
    quote: "Approximately 428B total; 23B activated per token"

  shape.d_model: {value: 6144, source: config, at: "/text_config/hidden_size"}
  shape.layers: {value: 60, source: config, at: "/text_config/num_hidden_layers"}
  shape.tied_embeddings: {value: false, source: config, at: "/text_config/tie_word_embeddings"}
  shape.vocab: {value: 200_064, source: config, at: "/text_config/vocab_size"}

  attn.bias:
    value: false
    source: hf-transformers
    at: "modeling_minimax_m3_vl.py; MiniMaxM3VLAttention.__init__"
    quote: "self.q_proj = nn.Linear(config.hidden_size, config.num_attention_heads * self.head_dim, bias=False)"
    note: "Transformers implementation of model_type minimax_m3_vl (the type this config declares); the card lists Transformers support as in progress."
  attn.layout:
    value: "60 MSA"
    source: card
    at: "README.md; What’s New in M3.1-Flash"
    quote: "Sparse attention throughout: the first three full-attention layers are replaced with sparse attention."
    note: "Uniform: /text_config/sparse_attention_config/sparse_attention_freq | count 1 = 60 = /text_config/num_hidden_layers. MiniMax-M3 ran dense GQA in its first three layers."
    sequence: [MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA,
      MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA,
      MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA, MSA]
  attn.global_layers:
    value: 60
    source: config
    at: "/text_config/sparse_attention_config/sparse_attention_freq | count 1"
    note: "All 60 layers run MSA (block-sparse global attention over GQA heads); M3's three leading dense GQA layers are replaced. sparse_attention_freq maps to layer_types minimax_m3_sparse in the Transformers config."
  attn.head_dim: {value: 128, source: config, at: "/text_config/head_dim"}
  attn.heads: {value: 64, source: config, at: "/text_config/num_attention_heads"}
  attn.kind:
    value: "MSA (block-sparse over GQA)"
    source: card
    at: "README.md; What’s New in M3.1-Flash"
    quote: "Sparse attention throughout: the first three full-attention layers are replaced with sparse attention."
    note: "Card, Model at a Glance: MiniMax Sparse Attention (MSA) throughout the model. Main attention keeps 64 query / 4 KV heads; the indexer selects key blocks per KV group."
  attn.kv_heads: {value: 4, source: config, at: "/text_config/num_key_value_heads"}
  attn.position:
    value: "partial RoPE (64 of 128 dims)"
    source: hf-transformers
    at: "modeling_minimax_m3_vl.py; MiniMaxM3VLAttention docstring"
    quote: "M3 attention: per-head Gemma QK-norm + partial RoPE"
    note: "/text_config/rotary_dim 64 of /text_config/head_dim 128."
  attn.qk_norm:
    value: true
    source: config
    at: "/text_config/use_qk_norm"
    note: "Per head (/text_config/qk_norm_type per_head; MiniMaxM3VLAttention q_norm/k_norm over head_dim)."
  attn.rope_fraction: {value: 0.5, source: config, at: "/text_config/partial_rotary_factor"}
  attn.rope_theta:
    value: 10_000_000
    source: config
    at: "/text_config/rope_theta"
    note: "MiniMax-M3 uses 5,000,000."
  attn.sparse:
    value: "MSA in all 60 layers: indexer picks 16 key blocks of 128 tokens per query and KV group, the query's own block always among them; 4 index heads × 128 dims"
    source: config
    at: "config.json text_config.sparse_attention_config"
    quote: "\"sparse_topk_blocks\": 16, \"sparse_block_size\": 128,"
    note: "Max-pooled block scores (sparse_score_type max); local-block boost and per-KV-group selection in MiniMaxM3VLIndexer.forward (sparse_local_block 1 forces block position_id // 128); index-value path disabled on all 60 layers (sparse_disable_index_value); use_sparse_attention true. Blog: inference efficiency improved \"through more aggressive sparsity\"."

  attn.indexer_dim:
    value: 128
    source: config
    at: "/text_config/sparse_attention_config/sparse_index_dim"
    note: "One index key head shared across KV groups (MiniMaxM3VLIndexer.k_proj outputs index_head_dim); 4 index query heads (sparse_num_index_heads); cached in all 60 layers."

  ffn.activation:
    value: "SwiGLU (swigluoai: gate·σ(1.702·gate)·(up + 1))"
    source: hf-transformers
    at: "modeling_minimax_m3_vl.py; MiniMaxM3VLDenseMLP.forward"
    quote: "glu = gate * torch.sigmoid(gate * self.swiglu_alpha)"
    note: "Config hidden_act = swigluoai, swiglu_alpha = 1.702; output (up + 1.0) * glu; inputs clamped (see ffn.clamp)."
  ffn.bias:
    value: false
    source: hf-transformers
    at: "modeling_minimax_m3_vl.py; MiniMaxM3VLDenseMLP.__init__"
    quote: "self.gate_up_proj = nn.Linear(config.hidden_size, 2 * inter, bias=False)"
  ffn.clamp:
    value: "gate clamped at max 7, up clamped to [−7, 7] before the GLU; all dense, shared and routed FFNs"
    source: hf-transformers
    at: "modeling_minimax_m3_vl.py; MiniMaxM3VLDenseMLP.forward, MiniMaxM3VLExperts._apply_gate"
    quote: "up = up.clamp(min=-self.swiglu_limit, max=self.swiglu_limit)"
    note: "/text_config/swiglu_limit = 7.0."
  ffn.dim: {value: 12288, source: config, at: "/text_config/dense_intermediate_size"}

  moe.balancing:
    value: "score-correction bias added to sigmoid scores for top-k selection only"
    source: hf-transformers
    at: "modeling_minimax_m3_vl.py; MiniMaxM3VLTopKRouter.forward"
    quote: "scores_for_choice = routing_weights + self.e_score_correction_bias"
    note: "Inference routing code (config /text_config/use_routing_bias true); the training-time bias update and any auxiliary loss are not disclosed."
  moe.dense_layers: {value: 3, source: config, at: "/text_config/moe_layer_freq | count 0"}
  moe.expert_dim: {value: 3072, source: config, at: "/text_config/intermediate_size"}
  moe.experts: {value: 128, source: config, at: "/text_config/num_local_experts"}
  moe.norm_topk:
    value: true
    source: hf-transformers
    at: "modeling_minimax_m3_vl.py; MiniMaxM3VLTopKRouter.forward"
    quote: "top_k_weights /= top_k_weights.sum(dim=-1, keepdim=True)"
  moe.routed_scale:
    value: 2.0
    source: config
    at: "/text_config/routed_scaling_factor"
    note: "Multiplies the routed-expert output before the shared expert is added (MiniMaxM3VLSparseMoeBlock.forward)."
  moe.router: {value: sigmoid, source: config, at: "/text_config/scoring_func"}
  moe.shared: {value: 1, source: config, at: "/text_config/n_shared_experts"}
  moe.shared_dim: {value: 3072, source: config, at: "/text_config/shared_intermediate_size"}
  moe.top_k: {value: 4, source: config, at: "/text_config/num_experts_per_tok"}

  mtp.released:
    value: false
    source: index
    at: "/weight_map | has mtp."
    note: "Config declares no MTP modules (M3's num_mtp_modules / num_nextn_predict_layers are absent) and the checkpoint has no mtp.* tensors. The repository's dspark/ folder is a separately configured 5-layer DSpark draft model (DSparkMiniMaxDraftModel) for speculative decoding, which the card says replaces M3's EAGLE-like MTP approach; it is not an MTP head."

  norm.eps: {value: 1.0e-6, source: config, at: "/text_config/rms_norm_eps"}
  norm.placement:
    value: pre
    source: hf-transformers
    at: "modeling_minimax_m3_vl.py; MiniMaxM3VLDecoderLayer.forward"
    quote: "hidden_states = self.input_layernorm(hidden_states)"
  norm.type:
    value: "RMSNorm (1+w gain)"
    source: hf-transformers
    at: "modeling_minimax_m3_vl.py; MiniMaxM3VLRMSNorm"
    quote: "Gemma-style RMSNorm: normalizes in fp32 and scales by `weight + 1`."
    note: "Config /text_config/use_gemma_norm true."

  ctx.max:
    value: 1_048_576
    source: config
    at: "/text_config/max_position_embeddings"
    note: "Card, Model at a Glance: \"Context window: Up to 1,000,000 tokens\"."

  train.cutoff:
    value: "January 2026"
    source: chat-template
    at: "chat_template.jinja; build_system_message default system prompt"
    quote: "Knowledge cutoff: January 2026."
    note: "Stated in the default system prompt of the released chat template, not in a pretraining description."
