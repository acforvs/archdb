name: MiMo-V2.5-Pro-Base
org: Xiaomi
kind: base

sources:
  card: {url: https://huggingface.co/XiaomiMiMo/MiMo-V2.5-Pro-Base/resolve/1e94ccfda10a2e4dc62877139cd8b7d7b523a4be/README.md, kind: model-card}
  config: {url: https://huggingface.co/XiaomiMiMo/MiMo-V2.5-Pro-Base/resolve/1e94ccfda10a2e4dc62877139cd8b7d7b523a4be/config.json, kind: config}
  index: {url: https://huggingface.co/XiaomiMiMo/MiMo-V2.5-Pro-Base/resolve/1e94ccfda10a2e4dc62877139cd8b7d7b523a4be/model.safetensors.index.json, kind: config}
  modeling_mimo_v2: {url: https://huggingface.co/XiaomiMiMo/MiMo-V2.5-Pro-Base/resolve/1e94ccfda10a2e4dc62877139cd8b7d7b523a4be/modeling_mimo_v2.py, kind: code}
  blog: {url: https://web.archive.org/web/20261011084411/https://mimo.xiaomi.com/mimo-v2-5-pro/, kind: blog}

not_disclosed: [params.active_non_embedding, mtp.depth, moe.balancing, ctx.final, train.optimizer, train.lr_peak, train.lr_min, train.schedule, train.warmup, train.batch, train.weight_decay, train.betas, train.grad_clip]

config_unused:
  attention_chunk_size: "not read by modeling_mimo_v2.py"
  attention_projection_layout: "checkpoint storage layout (fused qkv_proj vs split), same math"
  sliding_window_size: "duplicate of /sliding_window; not read by modeling_mimo_v2.py"
  n_group: "1: no group-limited routing"
  topk_group: "1: no group-limited routing"

facts:
  meta.released:
    value: "2026-04-27"
    source: blog
    at: "MiMo-V2.5-Pro blog; header and Open Source section"
    quote: "April 27th, 2026 Xiaomi MiMo- V2.5 -Pro"
    note: "The blog's model table lists the Base checkpoint for download."
  meta.license:
    value: mit
    source: card
    at: "README.md; front matter"
    quote: "license: mit"
  meta.modality:
    value: "text"
    basis: inferred
    source: card
    at: "README.md; MiMo-V2.5-Pro"
    quote: "MiMo-V2.5-Pro is an open-source Mixture-of-Experts (MoE) language model"
    note: "No explicit modality statement; config.json (MiMoV2ForCausalLM) has no vision or audio config, unlike the omnimodal MiMo-V2.5/V2.6 releases."

  params.active:
    value: 42_000_000_000
    source: card
    at: "README.md; intro"
    quote: "with 1.02T total parameters and 42B active parameters"
  params.note:
    value: "Publisher's rounded figures; whether the three MTP modules are included is not stated."
    source: card
    at: "README.md; intro"
    quote: "with 1.02T total parameters and 42B active parameters"
  params.total:
    value: 1_020_000_000_000
    source: card
    at: "README.md; intro"
    quote: "with 1.02T total parameters and 42B active parameters"

  shape.d_model: {value: 6144, source: config, at: "/hidden_size"}
  shape.layers: {value: 70, source: config, at: "/num_hidden_layers"}
  shape.tied_embeddings: {value: false, source: config, at: "/tie_word_embeddings"}
  shape.vocab: {value: 152_576, source: config, at: "/vocab_size"}

  attn.global_layers:
    value: 10
    source: config
    at: "/hybrid_layer_pattern | count 0"
    note: "0 = full attention, 1 = SWA (modeling_mimo_v2.py MiMoV2DecoderLayer). Global layers at 0, 7, 15, 23, 31, 39, 47, 55, 62, 69."
  attn.head_dim: {value: 192, source: config, at: "/head_dim"}
  attn.heads: {value: 128, source: config, at: "/num_attention_heads"}
  attn.kind:
    value: "GQA, SWA"
    source: card
    at: "README.md; §1 Introduction"
    quote: "Interleaves Sliding Window Attention (SWA) and Global Attention (GA)"
  attn.kv_heads: {value: 8, source: config, at: "/num_key_value_heads"}
  attn.local_heads:
    value: 128
    source: config
    at: "/swa_num_attention_heads"
    note: "MiMoV2Attention.__init__ reads swa_* head counts and dims for SWA layers and the unprefixed keys for global layers."
  attn.local_kv_heads: {value: 8, source: config, at: "/swa_num_key_value_heads"}
  attn.local_head_dim:
    value: 192
    source: config
    at: "/swa_head_dim"
    note: "QK dim; V dim is swa_v_head_dim 128."
  attn.local_v_head_dim: {value: 128, source: config, at: "/swa_v_head_dim"}
  attn.local_rope_theta:
    value: 10000
    source: config
    at: "/swa_rope_theta"
    note: "MiMoV2RotaryEmbedding(is_swa=True) replaces rope_theta with swa_rope_theta."
  attn.qk_norm:
    value: false
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2Attention.forward"
    quote: "query_states = query_states.view(*input_shape, self.num_attention_heads, self.head_dim).transpose(1, 2)"
    note: "No norm between projection and RoPE in either layer type."
  attn.layout:
    value: "60 SWA + 10 global"
    source: card
    at: "README.md; §1 Introduction"
    quote: "Interleaves Sliding Window Attention (SWA) and Global Attention (GA) with a 6:1 ratio and 128 sliding window."
    basis: inferred
    note: "Card states 6:1; /hybrid_layer_pattern has 60 SWA and 10 global layers, in runs of 6, 7, 7, 7, 7, 7, 7, 6, 6 SWA between globals at 0, 7, 15, 23, 31, 39, 47, 55, 62, 69."
  attn.local_layers: {value: 60, source: config, at: "/hybrid_layer_pattern | count 1"}
  attn.position:
    value: "partial RoPE (64 of 192 QK dims; base 1e7 global, 1e4 SWA)"
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2Attention.__init__"
    quote: 'self.rope_dim = int(self.head_dim * getattr(config, "partial_rotary_factor", 1.0))'
    note: "partial_rotary_factor 0.334, rope_theta 1e7, swa_rope_theta 1e4 in config."
  attn.rope_fraction: {value: 0.334, source: config, at: "/partial_rotary_factor"}
  attn.rope_theta: {value: 10_000_000, source: config, at: "/rope_theta"}
  attn.v_head_dim: {value: 128, source: config, at: "/v_head_dim"}
  attn.scale:
    value: "values × 0.612 in every attention layer; QK scale 1/sqrt(192)"
    source: config
    at: "config.json; attention_value_scale"
    quote: '"attention_value_scale": 0.612'
    note: "modeling_mimo_v2.py MiMoV2Attention multiplies value_states by attention_value_scale before attention."
  attn.sinks:
    value: "learnable per-head sink bias in SWA layers; none in global layers"
    source: config
    at: "config.json; add_*_attention_sink_bias"
    quote: '"add_full_attention_sink_bias": false, "add_swa_attention_sink_bias": true'
    note: "modeling_mimo_v2.py concatenates attention_sink_bias (one logit per head) to the attention logits before softmax. The card calls it a learnable attention sink bias."
  attn.bias: {value: false, source: config, at: "/attention_bias"}
  attn.window: {value: 128, source: config, at: "/sliding_window"}

  ffn.activation:
    value: SwiGLU
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2MLP.forward"
    quote: "return self.down_proj(self.act_fn(self.gate_proj(hidden_states)) * self.up_proj(hidden_states))"
    note: "act_fn = ACT2FN[/hidden_act] = silu; used for the dense FFN and every routed expert."
  ffn.bias:
    value: false
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2MLP.__init__"
    quote: "self.gate_proj = nn.Linear(self.hidden_size, self.intermediate_size, bias=False)"
    note: "MiMoV2MLP is used for the dense FFN and every routed expert."
  ffn.dim:
    value: 16384
    source: config
    at: "/intermediate_size"
    note: "Dense FFN in layer 0 only."

  moe.dense_layers: {value: 1, source: config, at: "/moe_layer_freq | count 0"}
  moe.expert_dim: {value: 2048, source: config, at: "/moe_intermediate_size"}
  moe.experts: {value: 384, source: config, at: "/n_routed_experts"}
  moe.router:
    value: sigmoid
    source: config
    at: "/scoring_func"
    note: "topk_method noaux_tc: MiMoV2MoEGate adds e_score_correction_bias to the scores for top-k selection only; how it was trained is not stated."
  moe.norm_topk: {value: true, source: config, at: "/norm_topk_prob"}
  moe.shared:
    value: 0
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2MoE.__init__"
    quote: "self.experts = nn.ModuleList( [MiMoV2MLP(config, intermediate_size=config.moe_intermediate_size) for _ in range(config.n_routed_experts)] ) self.gate = MiMoV2MoEGate(config)"
    note: "MoE block holds routed experts and gate only; config n_shared_experts is null."
  moe.top_k: {value: 8, source: config, at: "/num_experts_per_tok"}

  mtp.ffn:
    value: dense
    source: blog
    at: "MiMo-V2.5-Pro blog; Architecture & training"
    quote: "A lightweight MTP module with dense FFNs is natively integrated for training and inference"
  mtp.released:
    value: true
    source: index
    at: "model.safetensors.index.json; weight_map"
    quote: '"model.mtp.layers.2.eh_proj.weight"'
    note: "Three MTP modules (model.mtp.layers.0–2, SWA + dense FFN) in model_mtp.safetensors. The blog says MTP is used in training; the number used in pretraining is not stated."

  norm.eps: {value: 1.0e-5, source: config, at: "/layernorm_epsilon"}
  norm.placement:
    value: pre
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2DecoderLayer.forward"
    quote: "residual = hidden_states hidden_states = self.input_layernorm(hidden_states)"
  norm.type:
    value: RMSNorm
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2DecoderLayer.__init__"
    quote: "self.input_layernorm = MiMoV2RMSNorm(config.hidden_size, eps=config.layernorm_epsilon)"

  ctx.max:
    value: 262_144
    source: card
    at: "README.md; §2 Model Downloads"
    quote: "MiMo-V2.5-Pro-Base 1.02T 42B 256K"
    note: "Card value for the base checkpoint; config max_position_embeddings is 1,048,576 (the post-trained MiMo-V2.5-Pro's 1M)."
  ctx.pretrain:
    value: 32768
    source: card
    at: "README.md; §1 Introduction"
    quote: "Trained on 27T tokens using FP8 mixed precision and native 32k seq length."
  ctx.extension:
    value: "extended from 32K up to 1M (stages not stated)"
    source: blog
    at: "MiMo-V2.5-Pro blog; Architecture & training"
    quote: "Pre-training runs on 27T tokens using FP8 mixed precision at a native 32K sequence length, with context extended up to 1M tokens."
    note: "Covers the series; the Base checkpoint is listed at 256K, and the length it was trained to is not stated."

  train.precision:
    value: "FP8 mixed precision"
    source: card
    at: "README.md; §1 Introduction"
    quote: "Trained on 27T tokens using FP8 mixed precision and native 32k seq length."
  train.tokens:
    value: 27_000_000_000_000
    source: card
    at: "README.md; §1 Introduction"
    quote: "Trained on 27T tokens using FP8 mixed precision and native 32k seq length."
