name: Qwen3.8-27B
org: Qwen
kind: reasoning
note: "No base checkpoint is public; facts describe the released post-trained checkpoint."

sources:
  card: {url: https://huggingface.co/Qwen/Qwen3.8-27B/resolve/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/README.md, kind: model-card}
  config: {url: https://huggingface.co/Qwen/Qwen3.8-27B/resolve/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/config.json, kind: config}
  hf-transformers: {url: https://raw.githubusercontent.com/huggingface/transformers/d4804f9d76b8c071b993d813e9e87067b780cbee/src/transformers/models/qwen3_5/modeling_qwen3_5.py, kind: code}
  weights-index: {url: https://huggingface.co/Qwen/Qwen3.8-27B/resolve/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/model.safetensors.index.json, kind: config}
  github: {url: https://raw.githubusercontent.com/QwenLM/Qwen3.8/2ea10dc725823bf7c3e21ce8557cbe15245132ae/README.md, kind: model-card}

not_disclosed: [mtp.depth, mtp.loss_weight, ctx.pretrain, ctx.final, train.tokens, train.optimizer, train.lr_peak, train.lr_min, train.schedule, train.warmup, train.batch, train.weight_decay, train.betas, train.grad_clip, train.precision, params.active_non_embedding]

config_unused:
  mamba_ssm_dtype: GDN recurrent-state dtype for serving; not read by the modeling code
  mrope_interleaved: not read; the modeling code always interleaves the T/H/W sections

facts:
  meta.released:
    value: "2026-08-14"
    source: github
    at: "QwenLM GitHub README; News"
    quote: "2026-08-14: Qwen3.8-27B is now available on"
    note: "Hugging Face repository created 2026-08-05, before public release."
  meta.license: {value: apache-2.0, source: card, at: "README.md; YAML front matter", quote: "license: apache-2.0"}
  meta.modality:
    value: "text + image + video"
    source: card
    at: "README.md; introduction"
    quote: "a native vision-language model that understands images and videos"

  params.active:
    value: 27_000_000_000
    source: card
    at: "README.md; Model Overview; Language Model"
    quote: "Number of Parameters: 27B"
    note: "Dense model; all parameters active."
  params.note:
    value: "Rounded card figure, listed under the Language Model block; the vision encoder is separate. Whether the MTP module is counted is not stated."
    source: card
    at: "README.md; Model Overview"
    quote: "Type: Causal Language Model with Vision Encoder"
  params.total:
    value: 27_000_000_000
    source: card
    at: "README.md; Model Overview; Language Model"
    quote: "Number of Parameters: 27B"

  shape.d_model: {value: 5120, source: config, at: "/text_config/hidden_size"}
  shape.layers: {value: 64, source: config, at: "/text_config/num_hidden_layers"}
  shape.tied_embeddings: {value: false, source: config, at: "/text_config/tie_word_embeddings"}
  shape.vocab: {value: 248_320, source: config, at: "/text_config/vocab_size"}

  attn.gate:
    value: "sigmoid, elementwise on the attention output before o_proj; gate projected jointly with Q"
    source: hf-transformers
    at: "modeling_qwen3_5.py; Qwen3_5Attention.forward"
    quote: "attn_output = attn_output * torch.sigmoid(gate)"
    note: "Config attn_output_gate true; the code applies the gate unconditionally."
  attn.global_layers: {value: 16, source: config, at: "/text_config/layer_types | count full_attention"}
  attn.head_dim: {value: 256, source: config, at: "/text_config/head_dim"}
  attn.heads: {value: 24, source: config, at: "/text_config/num_attention_heads"}
  attn.kind:
    value: "Gated DeltaNet, GQA"
    source: card
    at: "README.md; Model Overview; Hidden Layout"
    quote: "16 × (3 × (Gated DeltaNet → FFN) → 1 × (Gated Attention → FFN))"
    note: "Gated Attention is GQA with 24 Q / 4 KV heads."
  attn.kv_heads: {value: 4, source: config, at: "/text_config/num_key_value_heads"}
  attn.layout:
    value: "3 Gated DeltaNet : 1 GQA"
    source: card
    at: "README.md; Model Overview; Hidden Layout"
    quote: "16 × (3 × (Gated DeltaNet → FFN) → 1 × (Gated Attention → FFN))"
    note: "Config full_attention_interval 4; layer_types lists the same pattern."
  attn.linear_layers: {value: 48, source: config, at: "/text_config/layer_types | count linear_attention"}
  attn.position:
    value: "partial RoPE"
    source: card
    at: "README.md; Model Overview; Gated Attention"
    quote: "Rotary Position Embedding Dimension: 64"
    note: "64 of 256 head dims rotated; config rope_parameters mrope_section [11, 11, 10], interleaved in code."
  attn.qk_norm:
    value: true
    source: hf-transformers
    at: "modeling_qwen3_5.py; Qwen3_5Attention.__init__"
    quote: "self.q_norm = Qwen3_5RMSNorm(self.head_dim, eps=config.rms_norm_eps)"
    note: "Per-head RMSNorm on Q and K in the full-attention layers."
  attn.rope_fraction: {value: 0.25, source: config, at: "/text_config/partial_rotary_factor"}
  attn.rope_theta: {value: 10_000_000, source: config, at: "/text_config/rope_parameters/rope_theta"}
  attn.bias: {value: false, source: config, at: "/text_config/attention_bias"}
  attn.conv: {value: 4, source: config, at: "/text_config/linear_conv_kernel_dim"}
  attn.linear_head_dim: {value: 128, source: config, at: "/text_config/linear_value_head_dim"}
  attn.linear_heads: {value: 48, source: config, at: "/text_config/linear_num_value_heads"}
  attn.linear_kind:
    value: "Gated DeltaNet: 16 QK heads, 48 V heads, head dim 128, short conv 4, SiLU-gated RMSNorm on output"
    source: card
    at: "README.md; Model Overview; Gated DeltaNet"
    quote: "Number of Linear Attention Heads: 48 for V and 16 for QK"
    note: "QK heads/dim from config linear_num_key_heads and linear_key_head_dim; conv kernel from config linear_conv_kernel_dim; SiLU output gate from Qwen3_5RMSNormGated in modeling_qwen3_5.py; config output_gate_type swish (not read by the code)."

  ffn.activation:
    value: "SwiGLU"
    source: hf-transformers
    at: "modeling_qwen3_5.py; Qwen3_5MLP.forward"
    quote: "down_proj = self.down_proj(self.act_fn(self.gate_proj(x)) * self.up_proj(x))"
    note: "act_fn is SiLU (config hidden_act silu)."
  ffn.dim: {value: 17408, source: config, at: "/text_config/intermediate_size"}
  ffn.bias:
    value: false
    source: hf-transformers
    at: "modeling_qwen3_5.py; Qwen3_5MLP.__init__"
    quote: "self.gate_proj = nn.Linear(self.hidden_size, self.intermediate_size, bias=False)"

  mtp.modules:
    value: 1
    source: config
    at: "/text_config/mtp_num_hidden_layers"
    note: "One MTP decoder layer (mtp.layers.0 only in the weight index); card: MTP trained with multiple steps."
  mtp.block:
    value: "one decoder layer (gated attention + dense SwiGLU FFN); RMSNormed hidden state and RMSNormed next-token embedding fused by linear fc; final RMSNorm"
    source: weights-index
    at: "model.safetensors.index.json; weight_map mtp.* entries"
    quote: "mtp.pre_fc_norm_embedding.weight"
    note: "From weight names: pre_fc_norm_hidden, pre_fc_norm_embedding, fc, layers.0 (self_attn with q_norm/k_norm, mlp), norm."
  mtp.ffn:
    value: "dense"
    source: weights-index
    at: "model.safetensors.index.json; weight_map mtp.layers.0.mlp"
    quote: "mtp.layers.0.mlp.gate_proj.weight"
  mtp.shares_embedding:
    value: true
    source: config
    at: "config.json; mtp_use_dedicated_embeddings"
    quote: '"mtp_use_dedicated_embeddings": false'
    note: "The weight index has no MTP embedding or output head."
  mtp.released:
    value: true
    source: weights-index
    at: "model.safetensors.index.json; weight_map mtp.* entries"
    quote: "mtp.fc.weight"

  norm.placement:
    value: pre
    source: hf-transformers
    at: "modeling_qwen3_5.py; Qwen3_5DecoderLayer.forward"
    quote: "hidden_states = self.input_layernorm(hidden_states)"
  norm.type:
    value: "RMSNorm (1+w gain)"
    source: hf-transformers
    at: "modeling_qwen3_5.py; Qwen3_5RMSNorm.forward"
    quote: "output = output * (1.0 + self.weight.float())"
    note: "Gain initialized at 0 and applied as 1 + weight."
  norm.eps: {value: 1.0e-6, source: config, at: "/text_config/rms_norm_eps"}

  ctx.max:
    value: 1_000_000
    source: card
    at: "README.md; Model Overview"
    quote: "262,144 natively and extensible up to 1,000,000 tokens"
    note: "262,144 native (config max_position_embeddings); beyond that via inference-time YaRN."
