name: Ling-3.1-flash
org: inclusionAI
kind: reasoning
note: "No base checkpoint is public; facts describe the released post-trained checkpoint."

sources:
  card: {url: https://huggingface.co/inclusionAI/Ling-3.1-flash/resolve/a4ccd6b45c002ddb236f9cb77d52cc427482bf19/README.md, kind: model-card}
  config: {url: https://huggingface.co/inclusionAI/Ling-3.1-flash/resolve/a4ccd6b45c002ddb236f9cb77d52cc427482bf19/config.json, kind: config}
  hf-index: {url: https://huggingface.co/inclusionAI/Ling-3.1-flash/resolve/a4ccd6b45c002ddb236f9cb77d52cc427482bf19/model.safetensors.index.json, kind: config}
  modeling_bailing_moe_v3: {url: https://huggingface.co/inclusionAI/Ling-3.1-flash/resolve/a4ccd6b45c002ddb236f9cb77d52cc427482bf19/modeling_bailing_moe_v3.py, kind: code}
  tds: {url: https://huggingface.co/inclusionAI/AI-Transparency/resolve/b72c608a99347c0f4551161fd4c55ae11823460e/Ling-3.1_TDS-Summary.pdf, kind: paper}

not_disclosed: [params.active_non_embedding, mtp.depth, ctx.pretrain, ctx.final, train.tokens, train.optimizer, train.lr_peak, train.lr_min, train.schedule, train.warmup, train.batch, train.weight_decay, train.betas, train.grad_clip, train.precision]

config_unused:
  group_norm_size: not read by modeling_bailing_moe_v3.py
  linear_silu: not read by modeling_bailing_moe_v3.py
  max_window_layers: not read by modeling_bailing_moe_v3.py
  num_key_value_heads: only feeds an unused num_key_value_groups in MLA; KDA uses num_attention_heads
  rotary_dim: not read; MLA rotary width is qk_rope_head_dim

facts:
  meta.released:
    value: "2026-10-14"
    source: tds
    at: "Ling-3.1 TDS summary, §1.2 Date of placement of the model on the Union market"
    quote: "2026-10-14"
    note: "Hugging Face repository created 2026-10-13."
  meta.license: {value: mit, source: card, at: "README.md; YAML front matter", quote: "license: mit"}
  meta.modality:
    value: "text"
    source: card
    at: "README front matter"
    quote: "pipeline_tag: text-generation"
    basis: inferred
    note: "Card tags the checkpoint text-generation; config declares no vision or audio tower, and the TDS summary ticks only Text as a training-data modality."

  params.active:
    value: 25_000_000_000
    source: card
    at: "README.md; Introduction"
    quote: "With 560B total parameters, 25B active parameters per token"
  params.note:
    value: "Rounded publisher figures; whether the MTP layer is counted is not stated."
    source: card
    at: "README.md; Model Overview"
    quote: "Parameter Scale Total 560B, Activated 25B"
  params.total:
    value: 560_000_000_000
    source: card
    at: "README.md; Introduction"
    quote: "With 560B total parameters, 25B active parameters per token"

  shape.d_model: {value: 4096, source: config, at: "/hidden_size"}
  shape.layers: {value: 72, source: config, at: "/num_hidden_layers"}
  shape.tied_embeddings: {value: false, source: config, at: "/tie_word_embeddings"}
  shape.vocab: {value: 157_184, source: config, at: "/vocab_size"}

  attn.bias: {value: false, source: config, at: "/use_qkv_bias"}
  attn.conv: {value: 4, source: config, at: "/short_conv_kernel_size"}
  attn.gate:
    value: "head-wise sigmoid on the MLA output, before the output projection"
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3MultiLatentAttention.forward"
    quote: "gate = F.sigmoid(gate.float()).type_as(hidden_states)"
    note: "/gated_attention_proj_granularity_type = head_wise. KDA layers have their own sigmoid-gated output norm."
  attn.global_layers:
    value: 9
    source: card
    at: "README.md; Model Overview"
    quote: "Transformer Layers 63 KDA + 9 Gated MLA (7:1)"
  attn.head_dim:
    value: 192
    source: config
    at: "/qk_nope_head_dim + /qk_rope_head_dim"
    note: "MLA layers (= /qk_head_dim). /head_dim=128 is the KDA head size."
  attn.heads: {value: 64, source: config, at: "/num_attention_heads"}
  attn.kind:
    value: "KDA, MLA"
    source: card
    at: "README.md; Model Overview"
    quote: "Transformer Layers 63 KDA + 9 Gated MLA (7:1)"
  attn.kv_lora_rank: {value: 512, source: config, at: "/kv_lora_rank"}
  attn.layout:
    value: '7 KDA : 1 MLA'
    source: modeling_bailing_moe_v3
    at: modeling_bailing_moe_v3.py; DecoderLayer.__init__
    quote: if (layer_idx + 1) % config.layer_group_size == 0
    note: '/layer_group_size = 8: MLA at layers 7, 15, …, 71. Ordered from that conditional with /layer_group_size=8;
      the implementation also makes any incomplete final group global.'
    basis: inferred
    sequence: [KDA, KDA, KDA, KDA, KDA, KDA, KDA, MLA, KDA, KDA, KDA, KDA, KDA, KDA, KDA, MLA, KDA, KDA, KDA, KDA,
      KDA, KDA, KDA, MLA, KDA, KDA, KDA, KDA, KDA, KDA, KDA, MLA, KDA, KDA, KDA, KDA, KDA, KDA, KDA, MLA,
      KDA, KDA, KDA, KDA, KDA, KDA, KDA, MLA, KDA, KDA, KDA, KDA, KDA, KDA, KDA, MLA, KDA, KDA, KDA, KDA,
      KDA, KDA, KDA, MLA, KDA, KDA, KDA, KDA, KDA, KDA, KDA, MLA]
  attn.linear_head_dim:
    value: 128
    source: config
    at: "/head_dim"
    note: "BailingMoeV3KimiDeltaAttention uses /head_dim for both key and value heads."
  attn.linear_heads:
    value: 64
    source: config
    at: "/num_attention_heads"
    note: "BailingMoeV3KimiDeltaAttention sets num_heads = num_attention_heads."
  attn.linear_kind:
    value: "KDA: 64 heads × 128, short conv 4 + SiLU on q/k/v, L2-normed q/k, full-rank decay and output-gate projections, safe gate with lower bound −5, sigmoid-gated RMSNorm on output"
    source: config
    at: "config.json kda_lower_bound, kda_safe_gate, no_kda_lora"
    quote: "\"kda_lower_bound\": -5.0, \"kda_safe_gate\": true,"
    note: "no_kda_lora = true selects full-rank f_proj/g_proj in BailingMoeV3KimiDeltaAttention."
  attn.linear_layers:
    value: 63
    source: card
    at: "README.md; Model Overview"
    quote: "Transformer Layers 63 KDA + 9 Gated MLA (7:1)"
  attn.position:
    value: "partial RoPE (MLA, decoupled 64 of 192 QK dims, interleaved), NoPE (KDA)"
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3MultiLatentAttention.forward"
    quote: "q_rot, k_rot = apply_rotary_pos_emb_interleave(q_rot, k_rot, cos, sin)"
    note: "The rotary embedding overrides /partial_rotary_factor=0.5 with 1.0 over the 64 qk_rope_head_dim dims; interleaved per /rope_interleave."
  attn.q_lora_rank: {value: 1536, source: config, at: "/q_lora_rank"}
  attn.qk_norm:
    value: false
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3MultiLatentAttention.forward"
    quote: "key_states = torch.cat((k_pass, k_rot), dim=-1)"
    note: "MLA layers: RMSNorm only on the Q and KV latents; no per-head Q/K norm, and /use_qk_norm is not read. KDA layers L2-normalize q and k."
  attn.rope_dim: {value: 64, source: config, at: "/qk_rope_head_dim"}
  attn.rope_theta: {value: 6_000_000, source: config, at: "/rope_theta"}
  attn.v_head_dim: {value: 128, source: config, at: "/v_head_dim"}

  ffn.activation:
    value: SwiGLU
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3MLP.forward"
    quote: "return self.down_proj(self.act_fn(self.gate_proj(x)) * self.up_proj(x))"
    note: "act_fn = ACT2FN[/hidden_act] = silu; used for dense, shared and routed FFNs. Config expert_swiglu_limit_list (10 on layers 65–71) and share_expert_swiglu_limit_list (10 on layers 64–71) are not read by the modeling code."
  ffn.bias:
    value: false
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3MLP.__init__"
    quote: "self.gate_proj = nn.Linear(self.hidden_size, self.intermediate_size, bias=False)"
  ffn.dim: {value: 10240, source: config, at: "/intermediate_size"}

  moe.balancing:
    value: "aux-loss-free expert bias added to routing scores (noaux_tc)"
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3Gate.forward; config /moe_router_enable_expert_bias, /topk_method"
    quote: "scores_for_routing = scores + self.expert_bias"
    note: "Bias update rate not disclosed."
  moe.dense_layers: {value: 4, source: config, at: "/first_k_dense_replace"}
  moe.expert_dim: {value: 1280, source: config, at: "/moe_intermediate_size"}
  moe.experts: {value: 512, source: config, at: "/num_experts"}
  moe.groups:
    value: "8 groups, top-4 groups per token"
    source: config
    at: "config.json n_group, topk_group"
    quote: "\"n_group\": 8,"
    note: "/topk_group = 4; groups ranked by the sum of their top-2 biased scores (BailingMoeV3Gate.group_limited_topk)."
  moe.norm_topk:
    value: true
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3Gate.forward; config /norm_topk_prob"
    quote: "topk_weight = scores / (scores.sum(dim=-1, keepdim=True) + 1e-20) if self.top_k > 1 else scores"
  moe.routed_scale:
    value: 2.5
    source: config
    at: "/routed_scaling_factor"
    note: "Multiplied into the renormalized top-k weights in BailingMoeV3Gate.forward."
  moe.router:
    value: sigmoid
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3Gate.forward; config /score_function, /scoring_func"
    quote: "scores = torch.sigmoid(logits.float()).type_as(logits)"
    note: "Router logits computed in FP32 (/router_dtype fp32)."
  moe.shared: {value: 1, source: config, at: "/num_shared_experts"}
  moe.shared_dim: {value: 1280, source: config, at: "/moe_shared_expert_intermediate_size"}
  moe.top_k: {value: 8, source: config, at: "/num_experts_per_tok"}

  mtp.released:
    value: true
    source: hf-index
    at: "model.safetensors.index.json; weight_map"
    quote: "\"model.layers.72.eh_proj.weight\""
    note: "One MTP layer (MLA + MoE, /num_nextn_predict_layers = 1). Use in pretraining is not disclosed; the released config sets mtp_loss_scaling_factor to 0."

  norm.eps: {value: 1.0e-6, source: config, at: "/rms_norm_eps"}
  norm.placement:
    value: pre
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3DecoderLayer.forward"
    quote: "hidden_states = self.input_layernorm(hidden_states)"
  norm.type:
    value: RMSNorm
    source: modeling_bailing_moe_v3
    at: "modeling_bailing_moe_v3.py; BailingMoeV3DecoderLayer.__init__"
    quote: "self.input_layernorm = BailingMoeV3RMSNorm(config.hidden_size, eps=config.rms_norm_eps)"

  ctx.max:
    value: 1_048_576
    source: card
    at: "README.md; Introduction"
    quote: "a 1M-token context window"
    note: "Config max_position_embeddings is 262144 with rope_scaling null."

  train.cutoff:
    value: "approximately July 2026"
    source: tds
    at: "Ling-3.1 TDS summary, §1.3"
    quote: "Approximately July 2026."
    note: "Latest date of data acquisition/collection for model training, as stated in the EU AI Act training-content summary."
  train.data:
    value: ">10T text tokens; multilingual (mainly English and Chinese) web incl. Common Crawl, academic papers, code and developer Q&A, licensed text, own crawl (Ant Spider), synthetic data from Ling-2.6 models"
    source: tds
    at: "Ling-3.1 TDS summary, §1.3 and §2"
    quote: "More than 10 trillions tokens"
    note: "Overall training-data size after pre-processing, not tokens seen; the summary covers all training, not only pretraining."
