name: MiMo-V2.6-Flash
org: Xiaomi
kind: reasoning
note: "No base checkpoint is public; facts describe the released post-trained checkpoint. Architecture from the RL release; recipe facts from the V2.6 technical report."

sources:
  card: {url: https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL/resolve/dcd3fd83fb181622fbc606fbb1709901982a62c2/README.md, kind: model-card}
  config: {url: https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL/resolve/dcd3fd83fb181622fbc606fbb1709901982a62c2/config.json, kind: config}
  index: {url: https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL/resolve/dcd3fd83fb181622fbc606fbb1709901982a62c2/model.safetensors.index.json, kind: config}
  blog: {url: https://web.archive.org/web/20261010130906/https://mimo.xiaomi.com/mimo-v2-6/article, kind: blog}
  modeling_mimo_v2: {url: https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL/resolve/dcd3fd83fb181622fbc606fbb1709901982a62c2/modeling_mimo_v2.py, kind: code}
  report: {url: https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL/resolve/dcd3fd83fb181622fbc606fbb1709901982a62c2/MiMo_V2_6_technical_report.pdf, kind: paper}

not_disclosed: [params.active_non_embedding, mtp.depth, moe.balancing, train.lr_peak, train.lr_min, train.schedule, train.warmup, train.batch, train.weight_decay, train.betas, train.grad_clip, train.precision]

config_unused:
  attention_chunk_size: "not read by modeling_mimo_v2.py"
  attention_projection_layout: "checkpoint storage layout (fused qkv_proj vs split), same math"
  sliding_window_size: "duplicate of /sliding_window; not read by modeling_mimo_v2.py"
  moe_router_dtype: "not read by modeling_mimo_v2.py; serving flag"
  n_group: "1: no group-limited routing"
  topk_group: "1: no group-limited routing"
  rope_type: "rope_parameters 'default' (no scaling); processor_config value belongs to the vision tower"
  num_nextn_predict_layers: "released MTP module count (3, see mtp.released); not read by modeling_mimo_v2.py"

facts:
  meta.released:
    value: "2026-09-22"
    source: blog
    at: "Introducing MiMo-V2.6 series; header"
    quote: "September 22nd, 2026 Introducing MiMo-V2.6 series"
    note: "Same post: 'Today, we are releasing and open-sourcing the MiMo-V2.6 series.'"
  meta.license:
    value: mit
    source: card
    at: "README.md; front matter"
    quote: "license: mit"
  meta.modality:
    value: "text + image + video + audio"
    source: card
    at: "README.md; Model Summary"
    quote: "Modalities: Text, Image, Video, Audio"

  params.active:
    value: 15_000_000_000
    source: report
    at: "PDF page 6; Table 1"
    quote: "# Active Parameters 15B 42B"
  params.note:
    value: "Table 1 'Main Block' (text backbone); the card states 309B total. The 681M MiMo-ViT and the audio encoders (308M + 127M) are listed separately; MTP modules are not itemized."
    source: report
    at: "PDF page 6; Table 1"
    quote: "# Total Parameters 310B 1.02T"
  params.total:
    value: 310_000_000_000
    source: report
    at: "PDF page 6; Table 1"
    quote: "# Total Parameters 310B 1.02T"

  shape.d_model: {value: 4096, source: config, at: "/hidden_size"}
  shape.layers: {value: 48, source: config, at: "/num_hidden_layers"}
  shape.tied_embeddings: {value: false, source: config, at: "/tie_word_embeddings"}
  shape.vocab: {value: 152_576, source: config, at: "/vocab_size"}

  attn.global_layers:
    value: 9
    source: config
    at: "/hybrid_layer_pattern | count 0"
    note: "0 = full attention, 1 = SWA (modeling_mimo_v2.py MiMoV2DecoderLayer). Global layers at 0, 5, 11, 17, 23, 29, 35, 41, 47."
  attn.local_layers: {value: 39, source: config, at: "/hybrid_layer_pattern | count 1"}
  attn.head_dim: {value: 192, source: config, at: "/head_dim"}
  attn.v_head_dim: {value: 128, source: config, at: "/v_head_dim"}
  attn.heads: {value: 64, source: config, at: "/num_attention_heads"}
  attn.kv_heads: {value: 4, source: config, at: "/num_key_value_heads"}
  attn.local_heads:
    value: 64
    source: config
    at: "/swa_num_attention_heads"
    note: "MiMoV2Attention.__init__ reads swa_* head counts and dims for SWA layers and the unprefixed keys for global layers."
  attn.local_head_dim:
    value: 192
    source: config
    at: "/swa_head_dim"
    note: "QK dim; V dim is swa_v_head_dim 128."
  attn.local_v_head_dim: {value: 128, source: config, at: "/swa_v_head_dim"}
  attn.local_rope_theta:
    value: 10000
    source: config
    at: "/swa_rope_theta"
    note: "MiMoV2RotaryEmbedding(is_swa=True) replaces rope_theta with swa_rope_theta."
  attn.qk_norm:
    value: false
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2Attention.forward"
    quote: "query_states = query_states.view(*input_shape, self.num_attention_heads, self.head_dim).transpose(1, 2)"
    note: "No norm between projection and RoPE in either layer type."
  attn.local_kv_heads: {value: 8, source: config, at: "/swa_num_key_value_heads"}
  attn.kind:
    value: "GQA, SWA"
    source: report
    at: "PDF page 4; §2.1"
    quote: "interleave Local Sliding Window Attention (SWA) and Global Attention (GA)"
  attn.layout:
    value: Global at layers 0, 5, 11, 17, 23, 29, 35, 41, 47; SWA elsewhere (0-based)
    source: config
    at: config.json; /hybrid_layer_pattern
    quote: '"hybrid_layer_pattern": [ 0, 1, 1, 1, 1, 0, 1, 1, 1, 1, 1, 0, 1, 1, 1, 1, 1, 0, 1, 1, 1, 1, 1, 0, 1, 1,
      1, 1, 1, 0, 1, 1, 1, 1, 1, 0, 1, 1, 1, 1, 1, 0, 1, 1, 1, 1, 1, 0 ]'
    basis: inferred
    note: 'N is not given in the report. Config hybrid_layer_pattern has runs of 4, 5, 5, 5, 5, 5, 5, 5 SWA layers between
      globals, with layers 0 and 47 global. /hybrid_layer_pattern: 1 = SWA, 0 = global (MiMoV2DecoderLayer); ordered
      backbone only.'
    sequence: [GQA, SWA, SWA, SWA, SWA, GQA, SWA, SWA, SWA, SWA, SWA, GQA, SWA, SWA, SWA, SWA, SWA, GQA, SWA, SWA,
      SWA, SWA, SWA, GQA, SWA, SWA, SWA, SWA, SWA, GQA, SWA, SWA, SWA, SWA, SWA, GQA, SWA, SWA, SWA, SWA,
      SWA, GQA, SWA, SWA, SWA, SWA, SWA, GQA]
  attn.window:
    value: 128
    source: report
    at: "PDF page 4; §2.1"
    quote: "The sliding window size 𝑊 used in MiMo-V2.6 is 128."
    note: "Config sliding_window 128 (read by SWA layers)."
  attn.position:
    value: "partial RoPE (64 of 192 QK dims; base 1e7 global, 1e4 SWA)"
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2Attention.__init__"
    quote: 'self.rope_dim = int(self.head_dim * getattr(config, "partial_rotary_factor", 1.0))'
    note: "partial_rotary_factor 0.334, rope_theta 1e7, swa_rope_theta 1e4 in config."
  attn.rope_fraction: {value: 0.334, source: config, at: "/partial_rotary_factor"}
  attn.rope_theta: {value: 10_000_000, source: config, at: "/rope_theta"}
  attn.sinks:
    value: "learnable per-head sink bias on SWA layers only"
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2Attention.__init__"
    quote: 'or (getattr(config, "add_swa_attention_sink_bias", False) and is_swa)'
    note: "Config: add_swa_attention_sink_bias true, add_full_attention_sink_bias false."
  attn.scale:
    value: "values × 0.707"
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2Attention._forward_attention"
    quote: "value_states = value_states * self.v_scale"
    note: "v_scale is config attention_value_scale (0.707), applied in all attention layers; not mentioned in the report. QK scaling is the standard head_dim**-0.5."
  attn.bias: {value: false, source: config, at: "/attention_bias"}

  ffn.activation:
    value: SwiGLU
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2MLP.forward"
    quote: "return self.down_proj(self.act_fn(self.gate_proj(hidden_states)) * self.up_proj(hidden_states))"
    note: "act_fn is config hidden_act silu; routed experts use the same MiMoV2MLP."
  ffn.dim:
    value: 16384
    source: config
    at: "/intermediate_size"
    note: "Dense FFN in layer 0 only."

  moe.dense_layers:
    value: 1
    source: report
    at: "PDF page 4; §2.1"
    quote: "The only exception is the very first Transformer block, which uses global attention with a dense Feed-Forward Network"
    note: "Config moe_layer_freq is 0 for layer 0 only."
  moe.expert_dim: {value: 2048, source: config, at: "/moe_intermediate_size"}
  moe.experts: {value: 256, source: config, at: "/n_routed_experts"}
  moe.top_k: {value: 8, source: config, at: "/num_experts_per_tok"}
  moe.router:
    value: sigmoid
    source: config
    at: "/scoring_func"
    note: "topk_method noaux_tc: MiMoV2MoEGate adds e_score_correction_bias to the scores for top-k selection only; how it was trained is not stated."
  moe.norm_topk: {value: true, source: config, at: "/norm_topk_prob"}
  moe.shared:
    value: 0
    source: report
    at: "PDF page 4; §2.1"
    quote: "Both the SWA block and the GA block utilize a sparse MoE FFN without shared experts."

  mtp.ffn:
    value: dense
    source: report
    at: "PDF page 4; §2.1"
    quote: "MiMo-V2.6 also integrates an SWA and dense FFN based MTP"
  mtp.shares_embedding:
    value: true
    source: report
    at: "PDF page 5; Figure 2"
    quote: "LM Head (tied)"
    note: "Figure 2 labels the MTP block's embedding and LM head as tied to the main model's; the weight index has no MTP embedding or head weights."
  mtp.released:
    value: true
    source: index
    at: "model.safetensors.index.json; weight_map"
    quote: '"model.mtp.layers.2.eh_proj.weight"'
    note: "Native MTP: three SWA + dense-FFN modules, used in pretraining (§2.1) with the count during pretraining not stated. The 5-layer DFlash drafter (dflash/), which the card calls MTP, is a separate speculative decoder."

  norm.placement:
    value: pre
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2DecoderLayer.forward"
    quote: "residual = hidden_states hidden_states = self.input_layernorm(hidden_states)"
  norm.type:
    value: RMSNorm
    source: modeling_mimo_v2
    at: "modeling_mimo_v2.py; MiMoV2DecoderLayer.__init__"
    quote: "self.input_layernorm = MiMoV2RMSNorm(config.hidden_size, eps=config.layernorm_epsilon)"
  norm.eps: {value: 1.0e-6, source: config, at: "/layernorm_epsilon"}

  ctx.extension:
    value: "32K to 256K partway through pretraining; mid-training at 256K, then 1M in its final stage"
    source: report
    at: "PDF page 7; §3.1, §3.2"
    quote: "We begin pre-training with a context length of 32K tokens and extend it to 256K partway through training."
  ctx.final:
    value: 1_048_576
    source: report
    at: "PDF page 7; §3.2"
    quote: "then extend the context length to 1M in the final stage."
    note: "Reached in mid-training, after the 48T-token pretraining."
  ctx.max:
    value: 1_048_576
    source: card
    at: "README.md; Model Summary"
    quote: "Context Length: 1M tokens"
    note: "Config max_position_embeddings 1048576."
  ctx.pretrain:
    value: 32768
    source: report
    at: "PDF page 7; §3.1"
    quote: "We begin pre-training with a context length of 32K tokens and extend it to 256K partway through training."

  train.optimizer:
    value: AdamW
    source: report
    at: "PDF page 7; §3.1"
    quote: "We employ the AdamW optimizer in the pre-training of MiMo-V2.6."
    note: "Mid-training switches hidden weight matrices to Muown (a Muon variant); embeddings, LM head and router stay on AdamW."
  train.data:
    value: "text (web, books, papers, code, STEM); vision (captioning, grounding, OCR, GUI, conversation, video, visual coding); audio (speech-text interleaving, ASR, audio captioning)"
    source: report
    at: "PDF page 7; §3.1"
    quote: "The text corpus draws from a broad range of sources, including public web content, books, academic papers, code, and STEM materials."
  train.stages:
    value:
      - name: text
        tokens: 26_000_000_000_000
        note: "Text-only language backbone."
        quote: "MiMo-V2.6-Flash is trained on 48T tokens, comprising 26T tokens in the text stage and 22T in the omni stage."
      - name: omni
        tokens: 22_000_000_000_000
        note: "Joint training with the ViT and audio encoder on omni-modal data."
        quote: "MiMo-V2.6-Flash is trained on 48T tokens, comprising 26T tokens in the text stage and 22T in the omni stage."
    source: report
    at: "PDF page 7; §3.1"
  train.tokens:
    value: 48_000_000_000_000
    source: report
    at: "PDF page 7; §3.1"
    quote: "MiMo-V2.6-Flash is trained on 48T tokens, comprising 26T tokens in the text stage and 22T in the omni stage."
    note: "Excludes mid-training, whose token count is not stated."
