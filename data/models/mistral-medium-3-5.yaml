name: Mistral-Medium-3.5-128B
org: Mistral AI
kind: reasoning
note: "No base checkpoint is public; the card calls the release \"our first flagship merged model\", handling instruction-following, reasoning, and coding in a single set of weights."

sources:
  card: {url: https://huggingface.co/mistralai/Mistral-Medium-3.5-128B/resolve/22b2b868a15677cfa6061277ed2f653d1349a9ab/README.md, kind: model-card}
  config: {url: https://huggingface.co/mistralai/Mistral-Medium-3.5-128B/resolve/22b2b868a15677cfa6061277ed2f653d1349a9ab/config.json, kind: config}
  modeling_ministral3: {url: https://raw.githubusercontent.com/huggingface/transformers/d4804f9d76b8c071b993d813e9e87067b780cbee/src/transformers/models/ministral3/modeling_ministral3.py, kind: code}
  governance: {url: https://web.archive.org/web/20261007202143/https://legal.mistral.ai/ai-governance/models/mistral-medium-3/, kind: blog}

not_disclosed: [mtp.depth, ctx.pretrain, ctx.final, train.tokens, train.optimizer, train.lr_peak, train.lr_min, train.schedule, train.warmup, train.batch, train.weight_decay, train.betas, train.grad_clip, train.precision, params.active_non_embedding]

config_unused:
  max_position_embeddings: "serving limit; equals the advertised 262,144"

facts:
  meta.released:
    value: "2026-04-29"
    source: governance
    at: "AI Governance; Mistral Medium 3.0 family; Model Lifecycle table"
    quote: "Mistral Medium 3.5 model version general purpose ai model April 29, 2026"
  meta.license:
    value: "other (Modified MIT License)"
    source: card
    at: "README.md; License"
    quote: "This model is licensed under a [Modified MIT License](https://huggingface.co/mistralai/Mistral-Medium-3.5-128B/blob/main/LICENSE)."
    note: "Card front matter: license: other."
  meta.modality:
    value: "text + image"
    source: card
    at: "README.md; Key Features"
    quote: "Multimodal input: Accepts both text and image input, with text output."

  params.total:
    value: 128_000_000_000
    source: card
    at: "README.md; Key Features"
    quote: "Dense 128B parameters"
  params.active:
    value: 128_000_000_000
    source: card
    at: "README.md; Key Features"
    quote: "Dense 128B parameters"
    basis: inferred
    note: "Dense model: every parameter is active."

  shape.d_model: {value: 12288, source: config, at: "/text_config/hidden_size"}
  shape.layers: {value: 88, source: config, at: "/text_config/num_hidden_layers"}
  shape.tied_embeddings: {value: false, source: config, at: "/text_config/tie_word_embeddings"}
  shape.vocab: {value: 131_072, source: config, at: "/text_config/vocab_size"}

  attn.bias:
    value: false
    source: modeling_ministral3
    at: "modeling_ministral3.py; Ministral3Attention.__init__"
    quote: "self.q_proj = nn.Linear(config.hidden_size, config.num_attention_heads * self.head_dim, bias=False)"
  attn.global_layers:
    value: 88
    source: config
    at: "/text_config/num_hidden_layers"
    note: "/text_config/sliding_window is null, so every block uses full causal attention."
  attn.head_dim: {value: 128, source: config, at: "/text_config/head_dim"}
  attn.heads: {value: 96, source: config, at: "/text_config/num_attention_heads"}
  attn.kind:
    value: GQA
    source: modeling_ministral3
    at: "modeling_ministral3.py; Ministral3Attention.__init__"
    quote: "self.k_proj = nn.Linear(config.hidden_size, config.num_key_value_heads * self.head_dim, bias=False)"
    basis: inferred
    note: "96 query heads share 8 KV heads."
  attn.kv_heads: {value: 8, source: config, at: "/text_config/num_key_value_heads"}
  attn.position:
    value: RoPE
    source: modeling_ministral3
    at: "modeling_ministral3.py; Ministral3Attention.forward"
    quote: "query_states, key_states = apply_rotary_pos_emb(query_states, key_states, cos, sin)"
  attn.qk_norm:
    value: false
    source: modeling_ministral3
    at: "modeling_ministral3.py; Ministral3Attention.forward"
    quote: "query_states = self.q_proj(hidden_states).view(hidden_shape).transpose(1, 2)"
    note: "Q and K go from the projections straight to RoPE; no per-head norm."
  attn.rope_theta: {value: 1_000_000, source: config, at: "/text_config/rope_parameters/rope_theta"}

  ffn.activation:
    value: SwiGLU
    source: modeling_ministral3
    at: "modeling_ministral3.py; Ministral3MLP.forward"
    quote: "down_proj = self.down_proj(self.act_fn(self.gate_proj(x)) * self.up_proj(x))"
    note: "Config /text_config/hidden_act is silu."
  ffn.bias:
    value: false
    source: modeling_ministral3
    at: "modeling_ministral3.py; Ministral3MLP.__init__"
    quote: "self.gate_proj = nn.Linear(self.hidden_size, self.intermediate_size, bias=False)"
  ffn.dim: {value: 28672, source: config, at: "/text_config/intermediate_size"}

  norm.eps: {value: 1.0e-5, source: config, at: "/text_config/rms_norm_eps"}
  norm.placement:
    value: pre
    source: modeling_ministral3
    at: "modeling_ministral3.py; Ministral3DecoderLayer.forward"
    quote: "hidden_states = self.input_layernorm(hidden_states)"
  norm.type:
    value: RMSNorm
    source: modeling_ministral3
    at: "modeling_ministral3.py; Ministral3DecoderLayer.__init__"
    quote: "self.input_layernorm = Ministral3RMSNorm(config.hidden_size, eps=config.rms_norm_eps)"

  ctx.extension:
    value: "YaRN factor 64 over original 4,096 (release config)"
    source: config
    at: "config.json; text_config.rope_parameters"
    quote: "\"factor\": 64.0, \"llama_4_scaling_beta\": 0, \"mscale\": 1.0, \"mscale_all_dim\": 0.0, \"original_max_position_embeddings\": 4096,"
    note: "Training-time context stages are not disclosed; mscale_all_dim was corrected from 1.0 in commit c4be198. Same dict: rope_type/type yarn, beta_fast 4, beta_slow 1; llama_4_scaling_beta 0 disables the query length scaling."
  ctx.max:
    value: 262_144
    source: card
    at: "README.md; Key Features"
    quote: "256k context length"
