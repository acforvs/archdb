name: DeepSeek-V4-Flash-Base
org: DeepSeek
kind: base

sources:
  inference-kernel: {url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash/resolve/60d8d70770c6776ff598c94bb586a859a38244f1/inference/kernel.py, kind: code}
  flashmla-cache: {url: https://raw.githubusercontent.com/deepseek-ai/FlashMLA/07a1089857b63e74e3133630c02b083b75e8d4b2/README.md, kind: code}
  config: {url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-Base/resolve/8855555deef230a27a21a8d6f294b7b7497759b6/config.json, kind: config}
  report: {url: https://arxiv.org/pdf/2606.19348v1, kind: paper}
  v4-flash-inference-model: {url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash/resolve/60d8d70770c6776ff598c94bb586a859a38244f1/inference/model.py, kind: code}
  weight-index: {url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-Base/resolve/8855555deef230a27a21a8d6f294b7b7497759b6/model.safetensors.index.json, kind: config}
  license: {url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-Base/resolve/8855555deef230a27a21a8d6f294b7b7497759b6/LICENSE, kind: model-card}
  announcement: {url: https://web.archive.org/web/20261017101832/https://api-docs.deepseek.com/news/news260424/, kind: blog}

not_disclosed: [params.active_non_embedding, train.grad_clip, train.precision]

facts:
  meta.released:
    value: "2026-04-24"
    source: announcement
    at: "DeepSeek API Docs news, DeepSeek-V4 Preview Release"
    quote: "DeepSeek-V4 Preview Release 2026/04/24"
    note: "Same post announces open weights; arXiv v1 is dated 26 Apr 2026."
  meta.license:
    value: mit
    source: license
    at: "LICENSE (repository has no model card)"
    quote: "MIT License"
  params.active:
    value: 13_000_000_000
    source: report
    at: "p.24 §4.2.1"
    quote: "DeepSeek-V4-Flash comprises 284B total parameters, of which 13B are activated for each token."
  params.total:
    value: 284_000_000_000
    source: report
    at: "p.24 §4.2.1"
    quote: "DeepSeek-V4-Flash comprises 284B total parameters, of which 13B are activated for each token."

  shape.d_model: {value: 4096, source: config, at: "/hidden_size"}
  shape.layers: {value: 43, source: config, at: "/num_hidden_layers"}
  shape.tokenizer:
    value: "DeepSeek-V3 byte-level BPE plus special tokens for context construction; 128K vocab"
    source: report
    at: "p.24 §4.1"
    quote: "on top of the DeepSeek-V3 tokenizer, we introduce a few special tokens for context construction"
  shape.tied_embeddings: {value: false, source: config, at: "/tie_word_embeddings"}
  shape.vocab: {value: 129_280, source: config, at: "/vocab_size"}

  attn.bias: {value: false, source: config, at: "/attention_bias"}
  attn.global_layers:
    value: 41
    basis: inferred
    source: report
    at: "p.24 §4.2.1"
    quote: "For the first two layers, we use pure sliding window attention. For the subsequent layers, CSA and HCA are used in an interleaved manner."
    note: "43 layers minus 2 pure-SWA layers; /compress_ratios has 21 × 4 and 20 × 128."
  attn.head_dim: {value: 512, source: config, at: "/head_dim"}
  attn.heads: {value: 64, source: config, at: "/num_attention_heads", note: "Grouped low-rank output projection: /o_groups 8 groups, /o_lora_rank 1024 each."}
  attn.local_heads:
    value: 64
    source: config
    at: "/num_attention_heads"
    note: "Pure-SWA layers (compress ratio 0) use the same Attention class with n_heads, head_dim and one shared KV head."
  attn.local_kv_heads: {value: 1, source: config, at: "/num_key_value_heads"}
  attn.local_head_dim: {value: 512, source: config, at: "/head_dim"}
  attn.local_rope_theta:
    value: 10000
    source: config
    at: "/rope_theta"
    note: "Compress-ratio-0 layers use rope_theta without YaRN (Attention.__init__)."
  attn.kv_groups:
    value:
      - name: CSA main KV
        layers: 21
        elements: 512
        tokens_per_entry: 4
        note: "Layers with /compress_ratios 4; one shared K=V entry of head_dim per 4 tokens."
        quote: "kv_cache_size = args.window_size + (args.max_seq_len // self.compress_ratio if self.compress_ratio else 0)"
      - name: CSA indexer K
        layers: 21
        elements: 128
        tokens_per_entry: 4
        note: "One index_head_dim key per compressed entry (Indexer.kv_cache)."
        quote: 'self.register_buffer("kv_cache", torch.zeros(args.max_batch_size, args.max_seq_len // compress_ratio, self.head_dim), persistent=False)'
      - name: HCA main KV
        layers: 20
        elements: 512
        tokens_per_entry: 128
        note: "Layers with /compress_ratios 128; no indexer."
        quote: 'self.register_buffer("kv_cache", torch.zeros(args.max_batch_size, kv_cache_size, self.head_dim), persistent=False)'
      - name: SWA window
        layers: 43
        elements: 512
        window: 128
        note: "Ring buffer in every backbone layer (the 2 pure-SWA layers and the SWA branch of CSA/HCA); MTP block excluded."
        quote: "self.kv_cache[:bsz, start_pos % win] = kv.squeeze(1)"
    source: v4-flash-inference-model
    at: "V4-Flash inference/model.py; Attention.__init__, Attention.forward, Indexer.__init__"
  attn.kind:
    value: "SWA, CSA, HCA (CSA and HCA each with a 128-token SWA branch)"
    source: report
    at: "p.24 §4.2.1"
    quote: "For the first two layers, we use pure sliding window attention. For the subsequent layers, CSA and HCA are used in an interleaved manner."
  attn.kv_precision:
    value:
    - name: CSA main KV NoPE
      group: CSA main KV
      elements: 448
      bits: 8
      format: FP8 E4M3; E8M0 scales per 64 channels
      scale_count: 7
      scale_bits: 8
      padding_bytes: 1
      at: 'README.md; V4 layout: 448 NoPE bytes, 7 scale bytes and 1 padding byte'
      quote: The scale row is 8 Bytes
    - name: CSA main KV RoPE
      group: CSA main KV
      elements: 64
      bits: 16
      format: BF16
      at: 'README.md; V4 layout: 128 RoPE bytes'
      quote: the 64 `bfloat16` RoPE values (not quantized)
    - name: HCA main KV NoPE
      group: HCA main KV
      elements: 448
      bits: 8
      format: FP8 E4M3; E8M0 scales per 64 channels
      scale_count: 7
      scale_bits: 8
      padding_bytes: 1
      at: 'README.md; V4 layout: 448 NoPE bytes, 7 scale bytes and 1 padding byte'
      quote: The scale row is 8 Bytes
    - name: HCA main KV RoPE
      group: HCA main KV
      elements: 64
      bits: 16
      format: BF16
      at: 'README.md; V4 layout: 128 RoPE bytes'
      quote: the 64 `bfloat16` RoPE values (not quantized)
    - name: SWA window NoPE
      group: SWA window
      elements: 448
      bits: 8
      format: FP8 E4M3; E8M0 scales per 64 channels
      scale_count: 7
      scale_bits: 8
      padding_bytes: 1
      at: 'README.md; V4 layout: 448 NoPE bytes, 7 scale bytes and 1 padding byte'
      quote: The scale row is 8 Bytes
    - name: SWA window RoPE
      group: SWA window
      elements: 64
      bits: 16
      format: BF16
      at: 'README.md; V4 layout: 128 RoPE bytes'
      quote: the 64 `bfloat16` RoPE values (not quantized)
    - name: CSA indexer key
      group: CSA indexer K
      elements: 128
      bits: 4
      format: MXFP4 E2M1; E8M0 scales per 32 channels
      scale_count: 4
      scale_bits: 8
      source: inference-kernel
      at: inference/kernel.py; fp4_act_quant, default block_size 32
      quote: s = z.new_empty(*z.size()[:-1], N // block_size, dtype=torch.float8_e8m0fnu)
    source: flashmla-cache
    at: README.md; MLA Decoding / FP8 KV Cache; per-entry storage layouts
    note: Serving layout from the official FlashMLA kernels and post-training FP4 indexer QAT; main KV keeps the RoPE
      tail in BF16. Each main/SWA entry is 584 bytes, each indexer entry 68 bytes. This serving recipe is documented
      for the post-trained V4-Flash sibling; it does not establish FP4 QAT of the base checkpoint.
  attn.kv_heads:
    value: 1
    source: config
    at: "/num_key_value_heads"
    note: "Shared-KV MQA: one KV head serves as both key and value (p.11 §2.3.1)."
  attn.layout:
    value: "2 SWA, then 1 CSA : 1 HCA (21 CSA + 20 HCA)"
    source: report
    at: "p.24 §4.2.1"
    quote: "For the first two layers, we use pure sliding window attention. For the subsequent layers, CSA and HCA are used in an interleaved manner."
    note: "Counts from /compress_ratios (0 = SWA, 4 = CSA, 128 = HCA; trailing 0 is the MTP block)."
  attn.local_layers:
    value: 2
    source: report
    at: "p.24 §4.2.1"
    quote: "For the first two layers, we use pure sliding window attention."
  attn.position:
    value: "partial RoPE (last 64 dims of Q and KV entries; inverse rotation on attention output)"
    source: report
    at: "p.13 §2.3.3"
    quote: "we partially employ the Rotary Positional Embedding (RoPE)"
  attn.q_lora_rank: {value: 1024, source: config, at: "/q_lora_rank"}
  attn.qk_norm:
    value: true
    source: report
    at: "p.12 §2.3.3"
    quote: "we perform an additional RMSNorm operation on each head of the queries and the only head of the compressed KV entries, just before the core attention operation."
  attn.rope_fraction:
    value: 0.125
    basis: inferred
    source: report
    at: "p.13 §2.3.3"
    quote: "we apply RoPE to its last 64 dimensions"
    note: "64 (/qk_rope_head_dim) of 512 head dims (/head_dim)."
  attn.rope_theta:
    value: 160_000
    source: config
    at: "/compress_rope_theta"
    note: "Compressed (CSA/HCA) layers use compress_rope_theta with YaRN (factor 16, original 65536); the 2 pure-SWA layers use rope_theta=10000 without YaRN (V4-Flash inference/model.py lines 475–479)."
  attn.sinks:
    value: "learnable per-head sink logit in the softmax denominator, every layer (CSA, HCA and the 2 pure-SWA layers)"
    source: weight-index
    at: "model.safetensors.index.json; /weight_map"
    quote: '"layers.0.attn.attn_sink"'
    note: "Layers 0–1 are the pure-SWA layers and carry attn_sink weights; sink formula p.13 §2.3.3 (described for CSA/HCA)."
  attn.sparse:
    value: "CSA: lightning indexer (64 heads × 128) selects top-512 of 4×-compressed KV entries; HCA (128×) attends densely"
    source: report
    at: "p.24 §4.2.1"
    quote: "the number of KV entries selected for sparse attention (i.e., attention top-k) to 512"
    note: "HCA does not employ sparse attention (p.11 §2.3.2); config /index_n_heads 64, /index_head_dim 128, /index_topk 512."
  attn.window: {value: 128, source: config, at: "/sliding_window"}

  ffn.activation:
    value: SwiGLU
    source: v4-flash-inference-model
    at: "V4-Flash inference/model.py line 603; Expert.forward"
    quote: "x = F.silu(gate) * up"
    note: "config /hidden_act silu."
  ffn.bias:
    value: false
    source: v4-flash-inference-model
    at: "V4-Flash inference/model.py lines 589–594; Expert.__init__"
    quote: "self.w1 = Linear(dim, inter_dim, dtype=dtype)"
    note: "Linear defaults to bias=False; shared and routed experts both use Expert."
  ffn.clamp:
    value: "up (linear) clamped to [−10, 10], gate capped at 10; routed and shared experts in every layer"
    source: report
    at: "p.26 §4.2.3"
    quote: "we clamped the linear component of SwiGLU to the range of [−10, 10], while capping the upper bound of the gate component at 10."
    note: "Applied throughout the training of both V4 models; inference code applies the same clamp (Expert.forward, /swiglu_limit 10)."

  moe.balancing:
    value: "aux-loss-free bias (update speed 0.001) + sequence-wise loss 1e-4; no node-limited routing"
    source: report
    at: "p.25 §4.2.2"
    quote: "For auxiliary-loss-free load balancing, we set the bias update speed to 0.001. For the balance loss, we set its loss weight to 0.0001 to avoid extreme imbalance within single sequences."
    note: "Node limit removed: p.7 §2.1. Bias enters top-k selection only (/topk_method noaux_tc)."
  moe.dense_layers:
    value: 0
    source: report
    at: "p.24 §4.2.1"
    quote: "We employ MoE layers in all Transformer blocks, but use the Hash routing strategy for the first 3 MoE layers."
  moe.expert_dim: {value: 2048, source: config, at: "/moe_intermediate_size"}
  moe.experts: {value: 256, source: config, at: "/n_routed_experts"}
  moe.norm_topk: {value: true, source: config, at: "/norm_topk_prob"}
  moe.routed_scale: {value: 1.5, source: config, at: "/routed_scaling_factor"}
  moe.router:
    value: "sqrt(softplus); hash on token ID (first 3 MoE layers)"
    source: report
    at: "p.7 §2.1"
    quote: "we change the activation function that computes the affinity scores from Sigmoid(·) into Sqrt(Softplus(·))."
    note: "Hash routing for the first 3 MoE layers: p.24 §4.2.1 (/num_hash_layers 3); /scoring_func sqrtsoftplus."
  moe.shared: {value: 1, source: config, at: "/n_shared_experts"}
  moe.shared_dim:
    value: 2048
    source: config
    at: "/moe_intermediate_size"
    note: "1 shared expert (/n_shared_experts) of the routed-expert width."
  moe.top_k: {value: 6, source: config, at: "/num_experts_per_tok"}

  mtp.depth:
    value: 1
    source: report
    at: "p.24 §4.2.1"
    quote: "The multi-token prediction depth is set to 1."
  mtp.modules:
    value: 1
    source: config
    at: "/num_nextn_predict_layers"
  mtp.block:
    value: "e_proj(RMSNorm(Emb(t_{i+1}))) + h_proj(RMSNorm(h)), then one block with 128-token pure-SWA attention and MoE FFN inside mHC, own mHC head and final norm"
    source: v4-flash-inference-model
    at: "V4-Flash inference/model.py; MTPBlock.forward"
    quote: "x = self.e_proj(e).unsqueeze(2) + self.h_proj(x)"
    note: "Attention is SWA-only because the MTP entry of /compress_ratios is 0; the report states the MTP configuration is identical to DeepSeek-V3 (p.7 §2)."
  mtp.ffn:
    value: MoE
    source: v4-flash-inference-model
    at: "V4-Flash inference/model.py; MTPBlock, Block.__init__"
    quote: "class MTPBlock(Block):"
    note: "Block builds self.ffn = MoE(layer_id, args); weight index has mtp.0.ffn.experts.*."
  mtp.shares_embedding:
    value: true
    source: v4-flash-inference-model
    at: "V4-Flash inference/model.py; Transformer.__init__"
    quote: "self.mtp[-1].embed = self.embed"
    note: "Output head shared as well; the Base checkpoint also stores copies (mtp.0.emb.tok_emb, mtp.0.head)."
  mtp.loss_weight:
    value: "0.3, reduced to 0.1 at the start of LR decay"
    source: report
    at: "p.25 §4.2.2"
    quote: "The MTP loss weight is set to 0.3 for most of the training, and to 0.1 upon the start of learning rate decay."
  mtp.released:
    value: true
    source: weight-index
    at: "model.safetensors.index.json; weight_map mtp.0.*"
    quote: "\"mtp.0.hc_head_base\""

  norm.eps: {value: 1e-6, source: config, at: "/rms_norm_eps"}
  norm.placement:
    value: pre
    source: v4-flash-inference-model
    at: "V4-Flash inference/model.py lines 688–700; Block.forward"
    quote: "x = self.attn_norm(x)"
    note: "Sublayers sit inside manifold-constrained hyper-connections (hc_pre/hc_post), expansion 4."
  norm.type:
    value: RMSNorm
    source: v4-flash-inference-model
    at: "V4-Flash inference/model.py lines 658–659; Block.__init__"
    quote: "self.attn_norm = RMSNorm(args.dim, self.norm_eps)"
  norm.residual:
    value: "mHC: 4 residual streams, residual mixing projected to doubly stochastic by Sinkhorn-Knopp (20 iterations), sigmoid-bounded input/output maps"
    source: report
    at: "p.24 §4.2.1"
    quote: "As for mHC, the expansion factor 𝑛hc is set to 4, and the number of Sinkhorn-Knopp iterations 𝑡max is set to 20."
    note: "mHC design: p.7–8 §2.2. config /hc_mult 4, /hc_sinkhorn_iters 20, /hc_eps 1e-6."

  ctx.extension:
    value: "4K → 16K → 64K → 1M during pretraining; compressed layers use YaRN (factor 16, original 65536)"
    source: report
    at: "p.25 §4.2.2"
    quote: "The training starts with a sequence length of 4K, and we gradually extend the training sequence length to 16K, 64K, and 1M."
    note: "config /rope_scaling: type yarn, factor 16, beta_fast 32, beta_slow 1, original_max_position_embeddings 65536."
  ctx.final:
    value: 1_048_576
    source: report
    at: "p.25 §4.2.2"
    quote: "The training starts with a sequence length of 4K, and we gradually extend the training sequence length to 16K, 64K, and 1M."
  ctx.max: {value: 1_048_576, source: config, at: "/max_position_embeddings"}
  ctx.pretrain:
    value: 4096
    source: report
    at: "p.25 §4.2.2"
    quote: "The training starts with a sequence length of 4K"
    note: "First stage; token split across the 4K/16K/64K/1M stages is not disclosed."

  train.batch:
    value: "ramped from a small size to 75.5M tokens, then constant for most of training"
    source: report
    at: "p.25 §4.2.2"
    quote: "increases the batch size (in tokens) from a small size to 75.5M and then keeps it at 75.5M during most of the training"
  train.batch_tokens:
    value: 75_500_000
    source: report
    at: "p.25 §4.2.2"
    quote: "increases the batch size (in tokens) from a small size to 75.5M and then keeps it at 75.5M during most of the training"
    note: "After the batch-size ramp; ramp length not disclosed."
  train.betas:
    value: "(0.9, 0.95)"
    source: report
    at: "p.25 §4.2.2"
    quote: "For AdamW, we set its hyper-parameters to 𝛽1 = 0.9, 𝛽2 = 0.95, 𝜀 = 10−20 , and weight_decay = 0.1."
  train.lr_min:
    value: 2.7e-5
    source: report
    at: "p.25 §4.2.2"
    quote: "we finally decay the learning rate to 2.7 × 10−5 following a cosine schedule"
  train.lr_peak:
    value: 2.7e-4
    source: report
    at: "p.25 §4.2.2"
    quote: "The learning rate is linearly warmed up in the first 2000 steps, maintained at 2.7 × 10−4 for most of the training."
  train.optimizer:
    value: "Muon + AdamW (AdamW for embedding, prediction head and RMSNorm weights)"
    source: report
    at: "p.25 §4.2.2"
    quote: "for the majority of parameters, but use the AdamW optimizer (Loshchilov and Hutter, 2017) for the embedding module, the prediction head module, and the weights of all RMSNorm modules."
    note: "Muon: momentum 0.95, weight decay 0.1, update RMS rescaled to 0.18 (same paragraph)."
  train.schedule:
    value: "linear warmup (2000 steps), constant 2.7e-4 for most of training, cosine decay to 2.7e-5 near the end"
    source: report
    at: "p.25 §4.2.2"
    quote: "The learning rate is linearly warmed up in the first 2000 steps, maintained at 2.7 × 10−4 for most of the training."
  train.stages:
    value:
      - name: context-4096
        seq_len: 4096
        note: "Dense attention."
        quote: "The training starts with a sequence length of 4K"
      - name: context-16384
        seq_len: 16384
        quote: "we gradually extend the training sequence length to 16K, 64K, and 1M."
      - name: context-65536
        seq_len: 65536
        note: "Sparse attention introduced here after a short indexer warm-up and dense attention for the first 1T tokens; kept for the rest of training."
        quote: "introduce sparse attention at the sequence length of 64K and keep sparse attention during the rest of the training."
      - name: context-1048576
        seq_len: 1_048_576
        quote: "we gradually extend the training sequence length to 16K, 64K, and 1M."
    source: report
    at: "p.25 §4.2.2"
  train.tokens:
    value: 32_000_000_000_000
    source: report
    at: "p.25 §4.2.2"
    quote: "We train DeepSeek-V4-Flash on 32T tokens"
  train.warmup:
    value: "2000 steps"
    source: report
    at: "p.25 §4.2.2"
    quote: "The learning rate is linearly warmed up in the first 2000 steps"
  train.weight_decay:
    value: 0.1
    source: report
    at: "p.25 §4.2.2"
    quote: "For AdamW, we set its hyper-parameters to 𝛽1 = 0.9, 𝛽2 = 0.95, 𝜀 = 10−20 , and weight_decay = 0.1."
  train.data:
    value: ">32T tokens: math, code, web, long documents (scientific papers, technical reports), larger multilingual corpus; agentic data added in mid-training"
    source: report
    at: "p.24 §4.1"
    quote: "our pre-training corpus comprises more than 32T tokens, containing mathematical contents, codes, web pages, long documents, and other high-quality categories."
  train.masking:
    value: "sample-level attention masking within packed sequences"
    source: report
    at: "p.24 §4.1"
    quote: "Different from DeepSeek-V3, we employ sample-level attention masking during pre-training."
  train.objective:
    value: "FIM, strategy inherited from DeepSeek-V3"
    source: report
    at: "p.24 §4.1"
    quote: "We also inherit the token-splitting (DeepSeek-AI, 2024) and Fill-in-Middle (FIM) (DeepSeek-AI, 2024) strategies from DeepSeek-V3."
    note: "The FIM rate is not restated for V4."
  train.stability:
    value: "Anticipatory Routing (routing indices computed with parameters from Δt steps earlier), auto-triggered with a short rollback on loss spikes; SwiGLU clamping"
    source: report
    at: "p.26 §4.2.3"
    quote: "we introduced an automatic detection mechanism that triggers a short rollback and activates Anticipatory Routing exclusively when a loss spike occurs"
    note: "SwiGLU clamp values under ffn.clamp."
  scaling.hp_rule:
    value: "AdamW hyper-parameters reused for Muon by rescaling the update RMS"
    source: report
    at: "p.14 §2.4"
    quote: "rescale the Root Mean Square (RMS) of the update matrix for reutilization of our AdamW hyper-parameters"
    note: "Update RMS 0.18 (p.25 §4.2.2)."
