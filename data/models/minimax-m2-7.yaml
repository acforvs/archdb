name: MiniMax-M2.7
org: MiniMax
kind: reasoning
note: "No base checkpoint is public; facts describe the released post-trained checkpoint."

sources:
  config: {url: https://huggingface.co/MiniMaxAI/MiniMax-M2.7/resolve/d494266a4affc0d2995ba1fa35c8481cbd84294b/config.json, kind: config}
  configuration_minimax_m2: {url: https://huggingface.co/MiniMaxAI/MiniMax-M2.7/resolve/d494266a4affc0d2995ba1fa35c8481cbd84294b/configuration_minimax_m2.py, kind: code}
  modeling_minimax_m2: {url: https://huggingface.co/MiniMaxAI/MiniMax-M2.7/resolve/d494266a4affc0d2995ba1fa35c8481cbd84294b/modeling_minimax_m2.py, kind: code}
  index: {url: https://huggingface.co/MiniMaxAI/MiniMax-M2.7/resolve/d494266a4affc0d2995ba1fa35c8481cbd84294b/model.safetensors.index.json, kind: config}
  license: {url: https://huggingface.co/MiniMaxAI/MiniMax-M2.7/resolve/d494266a4affc0d2995ba1fa35c8481cbd84294b/LICENSE, kind: model-card}
  report: {url: https://arxiv.org/pdf/2605.26494v2, kind: paper}
  hf-api: {url: https://huggingface.co/api/models/MiniMaxAI/MiniMax-M2.7, kind: api}

not_disclosed:
  - mtp.ffn
  - train.optimizer
  - train.lr_peak
  - train.lr_min
  - train.warmup
  - train.batch
  - train.weight_decay
  - train.betas
  - train.grad_clip
  - train.precision
  - params.active_non_embedding

config_unused:
  use_mtp: "MTP flag; not read by modeling_minimax_m2.py, which has no MTP path"

facts:
  meta.released:
    value: "2026-04-09"
    source: hf-api
    at: "/createdAt"
    quote: "2026-04-09T"
    note: "Hugging Face repository creation date (no dated publisher page for the weight release found); the 2026-03-18 blog announced the model without weights."
  meta.license:
    value: "other (NON-COMMERCIAL LICENSE)"
    source: license
    at: "LICENSE; title"
    quote: "NON-COMMERCIAL LICENSE Non-commercial use permitted based on MIT-style terms"

  params.active:
    value: 9_800_000_000
    source: report
    at: "p.3 §2.1"
    quote: "It contains 229.9B total parameters, with 9.8B activated per token."
  params.note:
    value: "Report figures for M2, the series flagship; the report attributes the M2 → M2.5 → M2.7 progression to post-training. MTP scope not stated."
    source: report
    at: "p.2 §1"
    quote: "Pre-training on 29.2T tokens establishes the base; the bulk of"
  params.total:
    value: 229_900_000_000
    source: report
    at: "p.3 §2.1"
    quote: "It contains 229.9B total parameters, with 9.8B activated per token."

  shape.d_model: {value: 3072, source: config, at: "/hidden_size"}
  shape.layers: {value: 62, source: config, at: "/num_hidden_layers"}
  shape.tied_embeddings: {value: false, source: config, at: "/tie_word_embeddings"}
  shape.vocab: {value: 200_064, source: config, at: "/vocab_size"}

  attn.global_layers:
    value: 62
    source: config
    at: "/attn_type_list | count 1"
    note: "Every layer is full softmax attention (/sliding_window unset)."
  attn.head_dim: {value: 128, source: config, at: "/head_dim"}
  attn.heads: {value: 48, source: config, at: "/num_attention_heads"}
  attn.kind:
    value: GQA
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; MiniMaxM2Attention.__init__"
    quote: "self.k_proj = nn.Linear(config.hidden_size, config.num_key_value_heads * self.head_dim, bias=False)"
  attn.kv_heads: {value: 8, source: config, at: "/num_key_value_heads"}
  attn.position:
    value: "partial RoPE (64 of 128 dims)"
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; apply_rotary_pos_emb"
    quote: "q_rot, q_pass = q[..., :rotary_dim], q[..., rotary_dim:]"
  attn.qk_norm:
    value: false
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; MiniMaxM2Attention.__init__"
    quote: "self.q_norm = MiniMaxM2RMSNorm(self.head_dim * config.num_attention_heads, eps=config.rms_norm_eps)"
    note: "QK-norm exists (/use_qk_norm true) but is not per head: one RMSNorm spans all heads' concatenated Q (48×128) and another all K (8×128), before the per-head reshape (/qk_norm_type per_layer)."
  attn.rope_fraction:
    value: 0.5
    source: configuration_minimax_m2
    at: "configuration_minimax_m2.py; MiniMaxM2Config.__init__"
    quote: "self.partial_rotary_factor = self.rotary_dim / self.head_dim"
    basis: inferred
    note: "/rotary_dim 64 ÷ /head_dim 128."
  attn.rope_theta: {value: 5_000_000, source: config, at: "/rope_theta"}
  attn.bias:
    value: false
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; MiniMaxM2Attention.__init__"
    quote: "self.q_proj = nn.Linear(config.hidden_size, config.num_attention_heads * self.head_dim, bias=False)"

  ffn.activation:
    value: SwiGLU
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; MiniMaxM2MLP.forward"
    quote: "current_hidden_states = self.act_fn(self.w1(hidden_states)) * self.w3(hidden_states)"
    note: "act_fn is SiLU (config hidden_act)."
  ffn.bias:
    value: false
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; MiniMaxM2MLP.__init__"
    quote: "self.w1 = nn.Linear(self.hidden_dim, self.ffn_dim, bias=False)"

  moe.balancing:
    value: "learnable per-expert routing bias trained jointly with the model + greatly reduced auxiliary loss (coefficient not stated)"
    source: report
    at: "p.3–4 §2.2.1"
    quote: "These biases are optimized jointly with model parameters and implicitly regulate expert"
    note: "Reduced auxiliary loss: same sentence, p.4. The bias enters top-k selection only (MiniMaxM2SparseMoeBlock e_score_correction_bias; config /use_routing_bias true)."
  moe.dense_layers:
    value: 0
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; MiniMaxM2DecoderLayer.__init__"
    quote: "self.block_sparse_moe = MiniMaxM2SparseMoeBlock(config)"
    note: "Every decoder layer is MoE."
  moe.expert_dim: {value: 1536, source: config, at: "/intermediate_size"}
  moe.experts: {value: 256, source: config, at: "/num_local_experts"}
  moe.norm_topk:
    value: true
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; MiniMaxM2SparseMoeBlock.route_tokens_to_experts"
    quote: "top_k_weights /= top_k_weights.sum(dim=-1, keepdim=True)"
  moe.router: {value: sigmoid, source: config, at: "/scoring_func"}
  moe.shared:
    value: 0
    source: config
    at: "config.json; shared_intermediate_size"
    quote: "\"shared_intermediate_size\": 0"
    note: "The modeling code has no shared-expert path."
  moe.top_k: {value: 8, source: config, at: "/num_experts_per_tok"}

  norm.eps: {value: 1e-6, source: config, at: "/rms_norm_eps"}
  norm.placement:
    value: pre
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; MiniMaxM2DecoderLayer.forward"
    quote: "hidden_states = self.input_layernorm(hidden_states)"
  norm.type:
    value: RMSNorm
    source: modeling_minimax_m2
    at: "modeling_minimax_m2.py; MiniMaxM2DecoderLayer.__init__"
    quote: "self.input_layernorm = MiniMaxM2RMSNorm(config.hidden_size, eps=config.rms_norm_eps)"

  ctx.pretrain:
    value: 8192
    source: report
    at: "p.6 §3"
    quote: "context window from 8K tokens through 32K and ultimately to 192K tokens."
    note: "Report states 8K."
  ctx.final:
    value: 196_608
    source: report
    at: "p.6 §3"
    quote: "context window from 8K tokens through 32K and ultimately to 192K tokens."
    note: "Report states 192K."
  ctx.extension:
    value: "8K → 32K → 192K in stages within the 9.3T-token decay phase"
    source: report
    at: "p.6 §3"
    quote: "The decay phase uses a total data budget of 9.3T tokens"
  ctx.max:
    value: 204_800
    source: config
    at: "/max_position_embeddings"
    note: "The M2.7 card states no context length."

  mtp.depth:
    value: 3
    source: report
    at: "p.5 §2.3"
    quote: "we expand from one to three MTP modules ( K = 3) during the decay phase of continued pre-training."
    note: "One MTP module (K=1) during the constant phase; three in the decay phase, matching config /num_mtp_modules 3."
  mtp.modules:
    value: 3
    source: report
    at: "p.5 §2.3"
    quote: "we expand from one to three MTP modules ( K = 3) during the decay phase of continued pre-training."
    note: "Added modules are copy-initialized, then trained jointly with the main model; config /num_mtp_modules 3."
  mtp.block:
    value: "DeepSeek-V3 design: RMSNorm on previous hidden state and next-token embedding, concat, linear projection, 1 transformer block"
    source: report
    at: "p.7 Figure 2"
    quote: "Figure 2 | Multi-Token Prediction (MTP) module architecture used in M2."
    note: "One transformer layer per module per config /mtp_transformer_layers; whether its FFN is MoE is not stated."
  mtp.shares_embedding:
    value: true
    source: report
    at: "p.7 Figure 2"
    quote: "Figure 2 | Multi-Token Prediction (MTP) module architecture used in M2."
    note: "Figure 2 marks the embedding layer and output head as shared with the main model."
  mtp.loss_weight:
    value: "0.3, annealed to 0.1 in the decay phase"
    source: report
    at: "p.5 §2.3"
    quote: "with an initial MTP loss weight of 0.3, which is annealed to 0.1 during the decay phase."
  mtp.released:
    value: false
    source: index
    at: "/weight_map | has mtp"
    note: "config.json declares num_mtp_modules 3; the checkpoint contains no MTP tensors."

  train.tokens:
    value: 29_200_000_000_000
    source: report
    at: "p.3 §2.1"
    quote: "is pre-trained on 29.2T tokens with a maximum context length of 192K."
    note: "19.9T constant phase + 9.3T decay phase; stated for M2."
  train.schedule:
    value: "constant phase (19.9T tokens), then decay phase (9.3T tokens, with context extension)"
    source: report
    at: "p.6 §3"
    quote: "During the constant phase of pre-training, we train on a total of 19.9T tokens."
  train.stages:
    value:
      - name: constant
        tokens: 19_900_000_000_000
        seq_len: 8192
        quote: "During the constant phase of pre-training, we train on a total of 19.9T tokens."
      - name: decay
        tokens: 9_300_000_000_000
        note: "short-text decay data plus long-context data; context 8K → 32K → 192K; MTP expanded to 3 modules"
        quote: "The decay phase uses a total data budget of 9.3T tokens"
    source: report
    at: "p.6 §3"
  train.data:
    value: "web, academic, books, code, structured QA; code, math and STEM upsampled"
    source: report
    at: "p.6 §3"
    quote: "with code, mathematics, and STEM content significantly upsampled relative to their natural distribution."
  scaling.ladder:
    value: "MoE fine-grained-expert and MTP ablations at 2B active / 17.8B total, 500B tokens"
    source: report
    at: "p.4 §2.2.1, Table 1"
    quote: "Total Params – 17.8B 17.8B 17.8B Training Tokens – 500B 500B 500B"
